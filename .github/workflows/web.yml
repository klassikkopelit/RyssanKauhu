# Builds the web (WebAssembly) version of RYSSÄN KAUHU and publishes it on
# GitHub Pages. Separate from build-release.yml, so the Windows, macOS and
# Linux builds are not affected by anything here.
#
#  - push to main or manual run: build and publish the page
#  - pull request: build only
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

name: Web version

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: 6.0.12

jobs:
  build:
    name: Build (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --parallel
          mkdir -p site
          cp build-web/index.html build-web/index.js build-web/index.wasm build-web/index.data site/
          ls -l site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
